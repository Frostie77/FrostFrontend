plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.frostfrontend'
    compileSdk 35

    defaultConfig {
        minSdk 26
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
